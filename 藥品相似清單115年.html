<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>115年藥品相似清單 | 藥劑科表單快捷工作台</title>
<style>
  :root{
    --primary:#1a365d;
    --secondary:#2b6cb0;
    --accent:#319795;
    --tallman:#c05621;      /* 大小寫警示字母 */
    --tallman-bg:#fff2e6;
    --dose-fg:#ffffff;
    --dose-bg:#2c7a7b;      /* 劑量標示 */
    --brand-fg:#a0aec0;     /* 廠牌／商品名 */
    --bg:#f7fafc;
    --card-bg:#ffffff;
    --text:#2d3748;
    --border:#e2e8f0;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Helvetica Neue",Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;}
  body{background:var(--bg);color:var(--text);line-height:1.6;padding:20px;}
  .container{max-width:1080px;margin:0 auto;}

  header{text-align:center;padding:34px 20px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:12px;margin-bottom:20px;box-shadow:0 4px 6px rgba(0,0,0,.1);}
  header h1{font-size:1.8rem;margin-bottom:8px;letter-spacing:1px;}
  header p{opacity:.9;font-size:.95rem;}
  .back-link{display:inline-block;margin-bottom:16px;color:var(--secondary);text-decoration:none;font-weight:600;}
  .back-link:hover{text-decoration:underline;}

  .legend{background:#ebf8fa;border-left:5px solid var(--accent);border-radius:0 10px 10px 0;padding:16px 20px;margin-bottom:8px;font-size:.88rem;color:#4a5568;display:flex;flex-wrap:wrap;gap:18px;align-items:center;}
  .legend-item{display:flex;align-items:center;gap:8px;}
  .legend-sample{font-weight:700;}
  .legend .tallman{background:var(--tallman-bg);color:var(--tallman);padding:1px 6px;border-radius:4px;}
  .legend .dose{background:var(--dose-bg);color:var(--dose-fg);padding:1px 7px;border-radius:4px;font-weight:600;}
  .legend .brand{color:var(--brand-fg);font-style:italic;}

  nav.toc{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 8px;}
  nav.toc a{background:var(--card-bg);border:1px solid var(--border);color:var(--primary);text-decoration:none;padding:8px 16px;border-radius:20px;font-size:.85rem;font-weight:600;transition:.2s;}
  nav.toc a:hover{background:var(--secondary);color:#fff;border-color:var(--secondary);}

  section.category{margin:44px 0 30px;scroll-margin-top:16px;}
  .cat-head{display:flex;align-items:baseline;gap:10px;border-bottom:3px solid var(--accent);padding-bottom:10px;margin-bottom:18px;}
  .cat-head h2{font-size:1.3rem;color:var(--primary);font-weight:700;}
  .cat-head .count{color:#a0aec0;font-size:.85rem;font-weight:600;}

  .group{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:0 2px 4px rgba(0,0,0,.04);}
  .group-idx{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;background:var(--secondary);color:#fff;font-size:.72rem;font-weight:700;border-radius:50%;margin-right:10px;flex-shrink:0;}
  .drug-row{display:flex;align-items:flex-start;gap:10px;padding:7px 0;}
  .drug-row + .drug-row{border-top:1px dashed var(--border);}
  .letter{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;font-size:.68rem;font-weight:700;color:#fff;flex-shrink:0;margin-top:2px;}
  .drug-text{font-size:.96rem;flex:1;}
  .drug-text .tallman{background:var(--tallman-bg);color:var(--tallman);font-weight:700;padding:0 2px;border-radius:3px;}
  .drug-text .dose{background:var(--dose-bg);color:var(--dose-fg);font-weight:600;padding:1px 6px;border-radius:5px;font-size:.86rem;white-space:nowrap;}
  .drug-text .form{color:var(--secondary);font-weight:600;font-size:.85rem;}
  .drug-text .brand{color:var(--brand-fg);font-style:italic;}
  .flag{display:inline-block;font-size:.75rem;color:#c53030;margin-right:2px;}

  /* 外觀相似 */
  .shape-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .shape-card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:16px 18px;box-shadow:0 2px 4px rgba(0,0,0,.04);}
  .shape-card-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .shape-card-head .cat-num{font-size:.7rem;color:#a0aec0;font-weight:700;}
  .shape-card-head .cat-label{font-size:.85rem;font-weight:700;color:var(--primary);}
  .pill-icon{flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.25);}
  .shape-card .drug-text{font-size:.86rem;}
  .shape-card .drug-row{padding:4px 0;}

  footer{text-align:center;margin-top:50px;padding:20px;color:#718096;font-size:.85rem;border-top:1px solid var(--border);}

  /* 相似對照表（含實際照片） */
  .subhead{font-size:1rem;color:var(--secondary);font-weight:700;margin:22px 0 14px;padding-left:10px;border-left:4px solid var(--secondary);}
  .compare-card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:16px 18px 18px;margin-bottom:14px;box-shadow:0 2px 4px rgba(0,0,0,.04);}
  .compare-items{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;}
  .compare-item{flex:1 1 150px;max-width:190px;background:#fbfcfd;border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center;}
  .compare-item img{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:8px;background:#fff;border:1px solid var(--border);margin-bottom:8px;}
  .compare-item .ph-name{font-size:.82rem;font-weight:700;color:var(--primary);line-height:1.35;word-break:break-word;}
  .compare-item .ph-common{font-size:.78rem;color:var(--secondary);margin-top:2px;}
  .compare-item .ph-chinese{font-size:.78rem;color:#4a5568;margin-top:2px;}
  .compare-item .ph-mark{font-size:.72rem;color:#a0aec0;margin-top:4px;}
  .compare-item .letter{margin-bottom:6px;}

  @media (max-width:600px){
    .legend{flex-direction:column;align-items:flex-start;}
  }
</style>

// ---- 藥名高亮：大小寫警示字母／劑量／劑型／廠牌 ----
function highlightDrug(str){
  const flagMatch = str.match(/^([!*◇§☆○]+)\s*/);
  let flags = "", rest = str;
  if(flagMatch){ flags = flagMatch[1]; rest = str.slice(flagMatch[0].length); }

  const re = /(\([^)]+\))|(\d+(?:\.\d+)?(?:\/\d+(?:\.\d+)?)*\s*(?:mg|g|ml|mcg|ug|IU|iu|%|meq|Doses)?)|\b(Soft Cap|Effervescent Tab|Tab|Cap|Inj\.?|Amp|Vial|BT|Supp|Syr\.?|Cream|Oint\.?|Gel|Soln|Pkg)\b|([A-Z]{2,})/g;
  const body = rest.replace(re, (m, brand, dose, form, tall) => {
    if(brand) return `<span class="brand">${brand}</span>`;
    if(dose)  return `<span class="dose">${dose}</span>`;
    if(form)  return `<span class="form">${form}</span>`;
    if(tall)  return `<span class="tallman">${tall}</span>`;
    return m;
  });
  return (flags ? `<span class="flag">${flags}</span>` : "") + body;
}

function renderGroup(groupStr, idx){
  const drugs = groupStr.split("&").map(s=>s.trim());
  const div = document.createElement('div');
  div.className = 'group';
  const rows = drugs.map((d,i)=>{
    const color = rowColors[i % rowColors.length];
    return `<div class="drug-row">
      <span class="letter" style="background:${color}">${String.fromCharCode(65+i)}</span>
      <span class="drug-text">${highlightDrug(d)}</span>
    </div>`;
  }).join("");
  div.innerHTML = `<div style="display:flex;align-items:flex-start;"><span class="group-idx">${idx+1}</span><div style="flex:1;">${rows}</div></div>`;
  return div;
}

const root = document.getElementById('listRoot');
const toc = document.getElementById('toc');

nameGroups.forEach((catData,ci)=>{
  const anchor = 'cat'+ci;
  const a = document.createElement('a');
  a.href = '#'+anchor;
  a.textContent = catData.cat;
  toc.appendChild(a);

  const section = document.createElement('section');
  section.className = 'category';
  section.id = anchor;
  section.innerHTML = `<div class="cat-head"><h2>${catData.cat}</h2><span class="count">${catData.groups.length} 組</span></div>`;
  catData.groups.forEach((g,i)=> section.appendChild(renderGroup(g,i)));
  root.appendChild(section);
});

// 外觀相似對照表
(function(){
  const anchor = 'catShape';
  const a = document.createElement('a');
  a.href = '#'+anchor;
  a.textContent = '藥品外觀相似對照表';
  toc.appendChild(a);

  const section = document.createElement('section');
  section.className = 'category';
  section.id = anchor;
  section.innerHTML = `<div class="cat-head"><h2>藥品外觀相似對照表</h2><span class="count">${shapeCategories.length} 類</span></div>`;
  const grid = document.createElement('div');
  grid.className = 'shape-grid';

  const sizePx = { sm:26, md:34, lg:42 };

  shapeCategories.forEach((sc,i)=>{
    const card = document.createElement('div');
    card.className = 'shape-card';
    const h = sizePx[sc.size];
    let w = h, radius = '50%', background, boxShadow = '';
    if(sc.shape === 'oval'){ w = h*1.7; radius = '50%'; }
    if(sc.shape === 'capsule'){ w = h*2.3; radius = '999px'; }
    if(sc.shape === 'octagon'){ radius = '0'; }

    if(sc.colors.length === 2){
      background = `linear-gradient(90deg, ${sc.colors[0]} 50%, ${sc.colors[1]} 50%)`;
    } else {
      background = sc.colors[0];
    }
    if(sc.flat === false){
      boxShadow = 'inset 0 -4px 6px rgba(0,0,0,.12), inset 0 3px 4px rgba(255,255,255,.6)';
    } else if(sc.flat === true){
      boxShadow = 'inset 0 0 0 1px rgba(0,0,0,.06)';
    } else {
      boxShadow = 'inset 0 -2px 4px rgba(0,0,0,.08)';
    }
    const border = sc.colors[0] === '#ffffff' ? '1px solid #cbd5e0' : 'none';

    let clipPath = '';
    if(sc.shape === 'octagon'){
      clipPath = 'clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);';
    }

    const icon = document.createElement('div');
    icon.className = 'pill-icon';
    icon.setAttribute('style', `width:${w}px;height:${h}px;border-radius:${radius};background:${background};box-shadow:${boxShadow};border:${border};${clipPath}`);

    const head = document.createElement('div');
    head.className = 'shape-card-head';
    head.innerHTML = `<div class="cat-num">${i+1}</div>`;
    head.insertBefore(icon, head.firstChild);
    const label = document.createElement('div');
    label.className = 'cat-label';
    label.textContent = sc.title;
    head.appendChild(label);

    card.appendChild(head);
    const drugs = sc.drugs.split("&").map(s=>s.trim());
    drugs.forEach((d,di)=>{
      const color = rowColors[di % rowColors.length];
      const row = document.createElement('div');
      row.className = 'drug-row';
      row.innerHTML = `<span class="letter" style="background:${color}">${String.fromCharCode(65+di)}</span><span class="drug-text">${highlightDrug(d)}</span>`;
      card.appendChild(row);
    });
    grid.appendChild(card);
  });

  section.appendChild(grid);
  root.appendChild(section);
})();

  const PART2_START = 73; // 從此組開始為「外觀相似」照片對照
  compareGroups.forEach((g, gi)=>{
    if(gi === 0){
      const h = document.createElement('div');
      h.className = 'subhead';
      h.textContent = 'Part 1．藥名／劑量相似對照';
      section.appendChild(h);
    }
    if(gi === PART2_START){
      const h = document.createElement('div');
      h.className = 'subhead';
      h.textContent = 'Part 2．外觀相似對照（實際照片）';
      section.appendChild(h);
    }

    const card = document.createElement('div');
    card.className = 'compare-card';
    card.innerHTML = `<span class="group-idx">${gi+1}</span>`;

    const itemsWrap = document.createElement('div');
    itemsWrap.className = 'compare-items';
    g.entries.forEach((e, ei)=>{
      const color = rowColors[ei % rowColors.length];
      const item = document.createElement('div');
      item.className = 'compare-item';
      const imgTag = e.img ? `<img src="assets/${e.img}" alt="${e.name}" loading="lazy">` : `<div style="width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;color:#cbd5e0;background:#f7fafc;border-radius:8px;border:1px dashed var(--border);margin-bottom:8px;font-size:.75rem;">無照片</div>`;
      item.innerHTML = `
        <span class="letter" style="background:${color}">${String.fromCharCode(65+ei)}</span>
        ${imgTag}
        <div class="ph-name">${highlightDrug(e.name)}</div>
        ${e.common ? `<div class="ph-common">${e.common}</div>` : ""}
        ${e.chinese ? `<div class="ph-chinese">${e.chinese}</div>` : ""}
        ${e.marking ? `<div class="ph-mark">${e.marking}</div>` : ""}
      `;
      itemsWrap.appendChild(item);
    });
    card.appendChild(itemsWrap);
    section.appendChild(card);
  });

  root.appendChild(section);
})();
